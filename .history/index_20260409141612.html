<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>フィードバックアプリ</h1>
        </header>

        <main>
            <section class="feedback-form">
                <h2>フィードバック投稿</h2>
                <form id="feedbackForm">
                    <div class="form-group">
                        <label for="name">名前:</label>
                        <input type="text" id="name" name="name" placeholder="お名前を入力してください" required>
                    </div>

                    <div class="form-group">
                        <label for="category">カテゴリ:</label>
                        <select id="category" name="category" required>
                            <option value="">選択してください</option>
                            <option value="bug">バグ報告</option>
                            <option value="feature">機能リクエスト</option>
                            <option value="improvement">改善提案</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">メッセージ:</label>
                        <textarea id="message" name="message" placeholder="ご意見をお聞かせください" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">送信</button>
                </form>
            </section>

            <section class="feedback-list">
                <h2>フィードバック一覧</h2>
                <div id="feedbackContainer" class="feedback-container">
                    <p class="empty-message">フィードバックはまだありません</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Feedback App. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
