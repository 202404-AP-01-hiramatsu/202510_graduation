<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フィードバック一覧 - 閲覧</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="viewer-page">
    <div class="container">
        <header>
            <div class="viewer-header-slider" aria-hidden="true">
                <div class="viewer-header-slide is-slide-1"></div>
                <div class="viewer-header-slide is-slide-2"></div>
                <div class="viewer-header-slide is-slide-3"></div>
            </div>
            <h1>フィードバック閲覧</h1>
            <p class="header-subtitle">登壇者ごとのフィードバックを確認できます</p>
        </header>

        <main>
            <div class="viewer-actions">
                <a href="index.html" class="btn btn-secondary">投稿ページに戻る</a>
                <a href="admin.html" class="btn btn-secondary">管理者ページ</a>
            </div>
            <section class="feedback-viewer">
                <div class="presenter-selector">
                    <label for="presenterSelect">登壇者を選択</label>
                    <select id="presenterSelect" data-placeholder="-- 登壇者を選択してください --"></select>
                </div>

                <div id="feedbackList" class="feedback-list">
                    <p class="empty-message">登壇者を選択するとフィードバックが表示されます</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Anonymous Feedback App. All rights reserved.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
