<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匿名フィードバック - 閲覧</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="viewer-page">
    <div class="container">
        <header>
            <h1>フィードバック閲覧</h1>
            <p class="header-subtitle">発表者別のフィードバック確認</p>
        </header>

        <main>
            <div class="viewer-actions">
                <a href="index.html" class="btn btn-secondary">投稿に戻る</a>
                <a href="admin.html" class="btn btn-secondary">管理ページ</a>
            </div>
            <section class="feedback-viewer">
                <div class="presenter-selector">
                    <label for="presenterSelect">発表者を選択:</label>
                    <select id="presenterSelect">
                        <option value="">-- 発表者を選択してください --</option>
                        <option value="山木 秀治">山木 秀治</option>
                        <option value="富澤 優華">富澤 優華</option>
                        <option value="谷 まゆ子">谷 まゆ子</option>
                        <option value="野口 千彩子">野口 千彩子</option>
                        <option value="大井 琉誠 LEE J">大井 琉誠 LEE J</option>
                        <option value="川口 ひより">川口 ひより</option>
                        <option value="杉原 有哉">杉原 有哉</option>
                        <option value="白子 政弘">白子 政弘</option>
                        <option value="筒井 沙莉奈">筒井 沙莉奈</option>
                        <option value="仲村 望来">仲村 望来</option>
                        <option value="田村 晴香">田村 晴香</option>
                        <option value="工藤 サフィア">工藤 サフィア</option>
                        <option value="宿利 忠海">宿利 忠海</option>
                        <option value="平松先生">平松先生</option>
                    </select>
                </div>

                <div id="feedbackList" class="feedback-list">
                    <p class="empty-message">発表者を選択するとフィードバックが表示されます</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Anonymous Feedback App. All rights reserved.</p>
        </footer>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
